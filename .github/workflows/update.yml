name: Update job board

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC (about 6am in the UK)
  workflow_dispatch:         # adds a "Run workflow" button for running it by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python jobboard.py
      - name: Save the results
        run: |
          git config user.name "job-board-bot"
          git config user.email "job-board-bot@users.noreply.github.com"
          git add -A
          git commit -m "Update jobs $(date -u +%F)" || echo "Nothing changed"
          git push
